<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>ATELIER — Concept Flagship & Material Laboratory</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("atelier_palette") || "klein";
          document.documentElement.setAttribute("data-theme", stored);
          if (stored === "infrared" || stored === "verdigris") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="Atelier Studio — Department of Textile Research & Concept Flagship. Small-batch architectural garments, technical tailoring, and material studies." />
    <meta property="og:type" content="website" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ATELIER Studio" />
    <meta property="og:title" content="ATELIER — Spatial Editorial Flagship" />
    <meta property="og:description" content="Sculptural drape, fluid double-faced cashmere, and architectural tailoring." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">

    <style>
      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #0c0c0e;
        transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.5s;
      }
      html.light #app-preloader {
        background: #efe9da;
      }
      #app-preloader.preloader-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .preloader-mark {
        font-family: "Archivo", "Helvetica Neue", sans-serif;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: -0.02em;
        font-size: 30px;
        color: #f5f4ef;
        opacity: 0;
        transform: translateY(10px);
        animation: preloader-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
      }
      html.light .preloader-mark {
        color: #1b1a13;
      }
      .preloader-mark .dot {
        color: #7c86ff;
      }
      html.light .preloader-mark .dot {
        color: #3644d6;
      }
      .preloader-bar {
        width: 130px;
        height: 2px;
        background: rgba(245, 244, 239, 0.12);
        overflow: hidden;
        opacity: 0;
        animation: preloader-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
      }
      html.light .preloader-bar {
        background: rgba(27, 26, 19, 0.12);
      }
      .preloader-bar-fill {
        width: 40%;
        height: 100%;
        background: #7c86ff;
        animation: preloader-slide 1.15s ease-in-out infinite;
      }
      html.light .preloader-bar-fill {
        background: #3644d6;
      }
      .preloader-caption {
        font-family: "Instrument Sans", "Helvetica Neue", sans-serif;
        font-size: 10px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #98978d;
        opacity: 0;
        animation: preloader-rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
      }
      @keyframes preloader-rise {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes preloader-slide {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(120%); }
        100% { transform: translateX(280%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .preloader-mark, .preloader-bar, .preloader-caption {
          animation: none;
          opacity: 1;
          transform: none;
        }
        .preloader-bar-fill {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-preloader" aria-hidden="true">
      <div class="preloader-mark">Atelier<span class="dot">.</span></div>
      <div class="preloader-bar"><div class="preloader-bar-fill"></div></div>
      <div class="preloader-caption">Objects Worth Keeping</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
